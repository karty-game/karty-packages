# Local renderer wrappers select the package geometry for runtime spawning.
# Package format 1 follows nested instance references during export resolution.
prefabs:
  - id: crate-small-dynamic
    renderable: true
    instances:
      - id: shape
        prefab: fps-kit.crate-small-dynamic
  - id: crate-medium-dynamic
    renderable: true
    instances:
      - id: shape
        prefab: fps-kit.crate-medium-dynamic
  - id: crate-large-dynamic
    renderable: true
    instances:
      - id: shape
        prefab: fps-kit.crate-large-dynamic
  - id: crate-long-dynamic
    renderable: true
    instances:
      - id: shape
        prefab: fps-kit.crate-long-dynamic
  - id: crate-tall-dynamic
    renderable: true
    instances:
      - id: shape
        prefab: fps-kit.crate-tall-dynamic
