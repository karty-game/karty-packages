# Copy this folder to levels/room in an FPS starter after importing fps-kit.
# Metres; player spawn (2, 2, 1.7); clear route through the middle.
version: 11
uv: { mode: wrap, scale: { x: 1, y: 1 } }
lighting:
  version: 1
  actors: true
  ambient: { x: 0.3, y: 0.3, z: 0.3 }
  lights:
    - {
        id: key,
        position: { x: 3, y: 4, z: 3.5 },
        color: { x: 1, y: 0.93, z: 0.82 },
        radius: 16,
      }
    - {
        id: fill,
        position: { x: 11, y: 11, z: 3.5 },
        color: { x: 0.78, y: 0.9, z: 1 },
        radius: 16,
      }
rooms:
  - id: room
    floor: { c: 0 }
    ceiling: { c: 4 }
    floor_material: fps-kit.floor-gray-grid
    ceiling_material: fps-kit.ceiling-dark-panel
    boundary:
      - {
          id: south,
          start: { x: 0, y: 0 },
          end: { x: 14, y: 0 },
          material: fps-kit.wall-orange-grid,
        }
      - {
          id: east,
          start: { x: 14, y: 0 },
          end: { x: 14, y: 14 },
          material: fps-kit.wall-blue-concrete,
        }
      - {
          id: north,
          start: { x: 14, y: 14 },
          end: { x: 0, y: 14 },
          material: fps-kit.wall-brick,
        }
      - {
          id: west,
          start: { x: 0, y: 14 },
          end: { x: 0, y: 0 },
          material: fps-kit.wall-white-panel,
        }

instances:
  - id: crate-small
    prefab: fps-kit.crate-small
    transform: { translation: { x: 3, y: 5, z: 0 } }
  - id: crate-medium
    prefab: fps-kit.crate-medium
    transform: { translation: { x: 5, y: 5, z: 0 } }
  - id: crate-large
    prefab: fps-kit.crate-large
    transform: { translation: { x: 3, y: 9, z: 0 } }
  - id: crate-long
    prefab: fps-kit.crate-long
    transform: { translation: { x: 6, y: 9, z: 0 } }
  - id: crate-tall
    prefab: fps-kit.crate-tall
    transform: { translation: { x: 9, y: 12, z: 0 } }
  - id: crate-stack
    prefab: fps-kit.crate-stack
    transform: { translation: { x: 12, y: 12, z: 0 } }
  - id: cover-low
    prefab: fps-kit.cover-low
    transform: { translation: { x: 10, y: 5, z: 0 } }
  - id: bumper-low
    prefab: fps-kit.bumper-low
    transform: { translation: { x: 3, y: 7, z: 0 } }
  - id: bumper-cover
    prefab: fps-kit.bumper-cover
    transform: { translation: { x: 7, y: 7, z: 0 } }
  - id: bumper-tall
    prefab: fps-kit.bumper-tall
    transform: { translation: { x: 11, y: 7, z: 0 } }

# A 25 cm step shows alternate floor/ceiling materials without extra images.
solids:
  - id: step
    footprint:
      [{ x: 5, y: 11 }, { x: 7, y: 11 }, { x: 7, y: 13 }, { x: 5, y: 13 }]
    bottom: { c: 0 }
    top: { c: 0.25 }
    side_material: fps-kit.floor-dark-checker
    top_material: fps-kit.floor-gray-checker
    bottom_material: fps-kit.ceiling-gray-panel
    collision: true

  # Small, non-colliding swatches keep the room outline a simple rectangle.
  - id: sample-wall-orange-panel
    footprint:
      [
        { x: 0.5, y: 0.04 },
        { x: 1.4, y: 0.04 },
        { x: 1.4, y: 0.11 },
        { x: 0.5, y: 0.11 },
      ]
    bottom: { c: 1.8 }
    top: { c: 2.7 }
    side_material: fps-kit.wall-orange-panel
    top_material: fps-kit.wall-orange-panel
    bottom_material: fps-kit.wall-orange-panel
