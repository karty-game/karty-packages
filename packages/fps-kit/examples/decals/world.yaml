              facing: fixed,
              alpha: cutout,
              width: 1,
              height: 1,
              origin_x: 0.5,
              origin_y: 0.5,
            }

# Preserve the FPS starter's runtime crate renderer.
prefabs:
  - id: crate-medium-dynamic
    renderable: true
    instances:
      - id: shape
        prefab: fps-kit.crate-medium-dynamic
