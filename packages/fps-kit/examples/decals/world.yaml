      # A fixed sprite lies on the floor when pitched 90 degrees.
      # Keep a small surface offset to avoid depth fighting.
      - id: floor-arrow
        kind: prop
        position: { x: 7, y: 5, z: 0.015 }
        actor:
          pitch_degrees: 90
          tags: [placeholder, route]
          sprite:
            {
              texture: fps-kit.decal-icon-arrow,
              facing: fixed,
              alpha: cutout,
              width: 1,
              height: 1,
              origin_x: 0.5,
              origin_y: 0.5,
            }
      - id: floor-target
        kind: prop
        position: { x: 7, y: 8, z: 0.015 }
        actor:
          pitch_degrees: 90
          tags: [placeholder, point-of-interest]
          sprite:
            {
