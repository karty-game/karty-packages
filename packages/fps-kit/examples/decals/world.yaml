# Copy this folder to levels/room in an FPS starter after importing fps-kit.
# Metres; player spawn (2, 2, 1.7); all 36 glyphs on the north wall.
# Fixed sprites are visual markers: goals and interaction stay in game code.
version: 11
uv: { mode: wrap, scale: { x: 1, y: 1 } }
lighting:
  version: 1
  actors: true
  ambient: { x: 0.7, y: 0.7, z: 0.7 }
rooms:
  - id: room
    floor: { c: 0 }
    ceiling: { c: 5 }
    floor_material: fps-kit.floor-gray-grid
    ceiling_material: fps-kit.ceiling-dark-panel
    boundary:
      - {
          id: south,
          start: { x: 0, y: 0 },
          end: { x: 14, y: 0 },
          material: fps-kit.wall-white-grid,
        }
      - {
          id: east,
          start: { x: 14, y: 0 },
          end: { x: 14, y: 14 },
          material: fps-kit.wall-white-grid,
        }
      - {
          id: north,
          start: { x: 14, y: 14 },
          end: { x: 0, y: 14 },
          material: fps-kit.wall-white-grid,
        }
      - {
          id: west,
          start: { x: 0, y: 14 },
          end: { x: 0, y: 0 },
          material: fps-kit.wall-white-grid,
        }
    contents:
      - id: decal-shape-cross
        kind: prop
        position: { x: 1.5, y: 13.98, z: 0.6 }
        actor:
          sprite:
            {
              texture: fps-kit.decal-shape-cross,
              facing: fixed,
              alpha: cutout,
              width: 0.6,
              height: 0.6,
              origin_x: 0.5,
              origin_y: 0.5,
